name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
        env:
          HARNESS_MOCK: "1"
      - run: python -m harness doctor

  # Live check: the plugin must activate on a REAL opencode server and seed its
  # skills. No model calls, no API keys — boot opencode serve, create a session
  # to force activation, assert via the server's own API. Catches loader-contract
  # or hook-payload drift in opencode releases before users hit it.
  opencode-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Plugin live smoke (real opencode server)
        run: python scripts/opencode_smoke.py --port 4199
