name: ci
# Branch pushes and PRs only: a `plugin-v*` tag points at a commit this already
# tested, and the release workflow runs there. `branches:` is what excludes tag
# events — a bare `[push, pull_request]` ran the whole matrix twice per release.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer run for the same ref replaces the older one. Without this every push
# leaves a full run behind, and a stalled job sits in the queue for hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      # The whole suite, one command: the bun contract tests, the CLI tests and
      # doctor are all in here, so a second `harness doctor` step added nothing
      # but runtime.
      - run: python -m pytest -q
        env:
          HARNESS_MOCK: "1"

