name: ci
# Branch pushes and PRs only: a `plugin-v*` tag points at a commit this already
# tested, and the release workflow runs there. `branches:` is what excludes tag
# events — a bare `[push, pull_request]` ran the whole matrix twice per release.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer run for the same ref replaces the older one. Without this every push
# leaves a full run behind, and a stalled job sits in the queue for hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      # The whole suite, one command: the bun contract tests, the CLI tests and
      # doctor are all in here, so a second `harness doctor` step added nothing
      # but runtime.
      - run: python -m pytest -q
        env:
          HARNESS_MOCK: "1"

  # Live check: the plugin must activate on a REAL opencode server and seed its
  # skills. No model calls, no API keys — boot opencode serve, create a session
  # to force activation, assert via the server's own API. Catches loader-contract
  # or hook-payload drift in opencode releases before users hit it.
  #
  # Push-only (a PR does not need a 200MB opencode download to be useful) and
  # hard-capped: the job this replaced hung for 32 minutes and had to be
  # cancelled by hand.
  opencode-live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      # PINNED to the 2.x line this plugin targets. `opencode.ai/install` with no
      # --version resolves GitHub's `releases/latest`, which is the 1.x train
      # (v1.18.x): that binary has no `server password` banner and no /api/plugin,
      # so the smoke used to sit on its deadline against a healthy server it
      # could not talk to. Bump this deliberately, after re-probing the contract.
      - name: Install opencode (2.x)
        env:
          OPENCODE_VERSION: "2.0.14"
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      # Stdlib only — the smoke script imports nothing from this package, so no
      # Python setup or pip install is needed to run it.
      - name: Plugin live smoke (real opencode server)
        run: python3 scripts/opencode_smoke.py --port 4199
