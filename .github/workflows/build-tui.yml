name: build-tui
on:
  push:
    tags: ["tui-v*"]
  workflow_dispatch:
env:
  TUI_REF: v1.18.31  # pinned sst/opencode tag; bump on rebase
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream opencode
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          ref: ${{ env.TUI_REF }}
          path: upstream
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply harness fork patches
        working-directory: upstream
        run: |
          shopt -s nullglob
          for p in ../tui/patches/*.patch; do
            echo "applying $p"
            git apply "$p"
          done
          echo "patches done"
      - name: Install (CI machine, not user PC)
        working-directory: upstream
        run: bun install
      - name: Compile harness-tui (single native target, no embedded web UI)
        working-directory: upstream/packages/opencode
        run: bun run script/build.ts --single --skip-embed-web-ui --skip-install
      - name: Collect binary
        working-directory: upstream/packages/opencode
        run: |
          find dist -maxdepth 3 | head -20
          f=$(find dist -type f -executable | head -1)
          test -n "$f" || { echo "no executable in dist/"; exit 1; }
          cp "$f" "$GITHUB_WORKSPACE/harness-tui-linux-x64"
          chmod +x "$GITHUB_WORKSPACE/harness-tui-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tui-linux-x64
          path: harness-tui-linux-x64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/tui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: harness-tui-linux-x64
