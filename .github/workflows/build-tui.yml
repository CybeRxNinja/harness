name: build-tui
on:
  push:
    tags: ["tui-v*"]
  pull_request:
    paths: ["tui/**", ".github/workflows/build-tui.yml", "harness/harness-opencode.json"]
  workflow_dispatch:
permissions:
  contents: write  # lets the Release step publish (repo default is read-only)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream pin
        id: pin
        run: |
          REF="$(tr -d ' \t\r\n' < tui/UPSTREAM_REF)"
          echo "TUI_REF=$REF" >> "$GITHUB_ENV"
          echo "pin=$REF"
      - name: Checkout upstream opencode
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          ref: ${{ env.TUI_REF }}
          path: upstream
      - uses: oven-sh/setup-bun@v2
        with:
          # pinned: upstream packageManager is bun@1.3.14; bun 1.4.x
          # produces binaries whose prompts defect (a.name TypeError)
          bun-version: 1.3.14
      - name: Apply harness fork patches
        working-directory: upstream
        run: |
          shopt -s nullglob
          for p in ../tui/patches/*.patch; do
            echo "applying $p"
            git apply "$p"
          done
          echo "installing harness sidebar plugin"
          cp ../tui/plugins/harness-panels.tsx packages/tui/src/feature-plugins/sidebar/harness.tsx
          cp ../tui/plugins/harness-route.tsx packages/tui/src/component/harness-route.tsx
          echo "patches done"
      - name: Install (CI machine, not user PC)
        working-directory: upstream
        run: bun install
      - name: Compile harness-tui (single native target, official-like flags)
        working-directory: upstream/packages/opencode
        run: OPENCODE_VERSION="${TUI_REF#v}" bun run script/build.ts --single --skip-embed-web-ui
      - name: Collect binary
        working-directory: upstream/packages/opencode
        run: |
          find dist -maxdepth 3 | head -20
          f=$(find dist -type f -executable | head -1)
          test -n "$f" || { echo "no executable in dist/"; exit 1; }
          cp "$f" "$GITHUB_WORKSPACE/harness-tui-linux-x64"
          chmod +x "$GITHUB_WORKSPACE/harness-tui-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tui-linux-x64
          path: harness-tui-linux-x64
      - name: Build AppImage (single-file, no install)
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          rm appimagetool.AppImage
          rm -rf harness.AppDir
          mkdir -p harness.AppDir/usr/bin
          cp harness-tui-linux-x64 harness.AppDir/usr/bin/harness-tui
          cp tui/appimage/AppRun harness.AppDir/AppRun
          cp tui/appimage/harness-tui.desktop harness.AppDir/
          cp tui/appimage/harness-tui.png harness.AppDir/
          cp harness/harness-opencode.json harness.AppDir/
          chmod +x harness.AppDir/AppRun harness.AppDir/usr/bin/harness-tui
          ARCH=x86_64 ./squashfs-root/AppRun harness.AppDir
          ls -la *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tui-x86_64-AppImage
          path: "*.AppImage"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/tui-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            harness-tui-linux-x64
            *.AppImage
