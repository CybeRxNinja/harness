name: build-tui
on:
  push:
    tags: ["tui-v*"]
  workflow_dispatch:
env:
  TUI_REF: v0.0.0  # pin sst/opencode tag here on each rebase
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream opencode
        uses: actions/checkout@v4
        with:
          repository: sst/opencode
          ref: ${{ env.TUI_REF }}
          path: upstream
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Copy fork patches manifest
        run: ls tui/README.md && echo "apply tui/patches/*.patch to upstream/ here"
      - name: Install (CI machine, not user PC)
        working-directory: upstream
        run: bun install
      - name: Compile harness-tui
        working-directory: upstream
        run: bun build --compile packages/opencode/src/index.ts --outfile harness-tui-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: harness-tui-linux-x64
          path: upstream/harness-tui-linux-x64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/tui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: upstream/harness-tui-linux-x64
