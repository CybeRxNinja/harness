[project]
name = "harness"
version = "0.1.0"
description = "Harness: a plugin for stock opencode (no fork) — native skills/memory tools, compaction recall, risk-gated permissions, and a stats sidebar. Python core is the installer and kept operators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.setuptools.package-data]
# data/skills/** keeps the skill tree intact (SKILL.md plus its references/),
# so an installed package seeds the same files the repo tree ships.
harness = ["harness-opencode.json", "data/skills/**/*", "plugin/*.ts", "plugin/*.tsx"]
