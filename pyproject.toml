[project]
name = "harness"
version = "0.1.0"
description = "All-in-one AI coding harness: orchestrator + builtin relay + RLM kernel + skills. Potato-PC safe, stdlib-only core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["harness-opencode.json"]
